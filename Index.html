<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain Tsubasa 5vs5</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            display: flex;
            gap: 40px;
            z-index: 100;
            border: 2px solid gold;
        }
        
        .team-score {
            font-size: 24px;
            font-weight: bold;
        }
        
        #nankatsu { color: #FF6B6B; }
        #toho { color: #4ECDC4; }
        
        #time {
            color: white;
            font-size: 20px;
        }
        
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            color: white;
            text-align: center;
            z-index: 1000;
            border: 3px solid gold;
        }
        
        button {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #1976D2, #03A9F4);
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <div class="team-score">
                <span id="nankatsu">Nankatsu 0</span>
            </div>
            <div id="time">00:00</div>
            <div class="team-score">
                <span id="toho">Toho 0</span>
            </div>
        </div>
        
        <div id="menu">
            <h1>⚽ CAPTAIN TSUBASA ⚽</h1>
            <h2>5 vs 5</h2>
            <div id="team-selection">
                <h3>Selecciona Equipo:</h3>
                <button onclick="selectTeam('nankatsu')">Nankatsu SC</button>
                <button onclick="selectTeam('toho')">Toho Academy</button>
            </div>
            <button onclick="startGame()">Iniciar Partido</button>
            <div id="controls-info">
                <h3>Controles:</h3>
                <p>WASD: Movimiento</p>
                <p>Espacio: Disparo/Pase</p>
                <p>Shift: Correr</p>
                <p>E: Tiro Especial</p>
            </div>
        </div>
        
        <div id="controls">
            <h3>Controles:</h3>
            <p>WASD: Movimiento | Espacio: Disparo | Shift: Correr</p>
        </div>
        
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Three.js y dependencias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>
    
    <!-- Nuestros scripts -->
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
    <script src="js/players.js"></script>
    <script src="js/ball.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/utils.js"></script>
</body>
  </html>￼Enter
